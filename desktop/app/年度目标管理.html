<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>年度目标管理 | LifeOS</title>
  <link rel="stylesheet" href="assets/window-frame.css" />
  <link rel="stylesheet" href="assets/database-manager.css" />
</head>
<body data-manager="annual-goals">
  <div class="window-frame" data-tauri-drag-region>
    <div class="window-title" data-tauri-drag-region>年度目标管理 | LifeOS</div>
    <div class="window-controls">
      <button class="window-control" type="button" data-window-control="minimize" aria-label="最小化">─</button>
      <button class="window-control" type="button" data-window-control="maximize" aria-label="最大化">□</button>
      <button class="window-control close" type="button" data-window-control="close" aria-label="关闭">×</button>
    </div>
  </div>
  <div class="page">
    <main class="shell">
      <header class="topbar">
        <div class="actions">
          <a class="btn secondary" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="16" height="16" style="margin-right:4px">
              <path d="m15 18-6-6 6-6" />
            </svg>
            返回日历
          </a>
        </div>
        <div class="brand">
          <div class="brand-mark" id="managerMark">年</div>
          <div>
            <h1 id="managerTitle">年度目标管理</h1>
            <p id="managerSubtitle">按年度管理目标；未完成优先，年份只是归属字段。</p>
          </div>
        </div>
      </header>

      <section class="layout">
        <aside class="sidebar">
          <div id="summaryGrid"></div>
          <div>
            <p class="notice">数据库文件</p>
            <div class="path" id="databasePath">annual-goals.csv</div>
          </div>
          <div class="notice" id="notice"></div>
        </aside>

        <section class="workspace">
          <div class="section-head">
            <div>
              <h2 id="workspaceTitle">年度目标</h2>
              <p id="workspaceSubtitle">年度目标跨日记同步；修改会写回独立 CSV，并同步影响晨间日记。</p>
            </div>
            <div class="toolbar" id="toolbar"></div>
          </div>
          <div class="record-list" id="recordList"></div>
        </section>
      </section>
    </main>
  </div>
  <script src="assets/lifeos-shared.js"></script>
  <script src="assets/database-manager.js"></script>
  <script src="assets/window-controls.js"></script>
</body>
</html>
