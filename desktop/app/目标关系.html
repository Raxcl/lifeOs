<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>目标关系 | LifeOS</title>
  <link rel="stylesheet" href="assets/window-frame.css" />
  <link rel="stylesheet" href="assets/目标关系.css" />
</head>
<body>
  <div class="window-frame" data-tauri-drag-region>
    <div class="window-title" data-tauri-drag-region>目标关系 | LifeOS</div>
    <div class="window-controls">
      <button class="window-control" type="button" data-window-control="minimize" aria-label="最小化">─</button>
      <button class="window-control" type="button" data-window-control="maximize" aria-label="最大化">□</button>
      <button class="window-control close" type="button" data-window-control="close" aria-label="关闭">×</button>
    </div>
  </div>
  <div class="wallpaper-layer" id="wallpaperLayer" aria-hidden="true"></div>
  <main class="relation-page">
    <header class="relation-header">
      <div>
        <p class="relation-eyebrow">WEEK · MONTH · YEAR</p>
        <h1>目标关系</h1>
        <p class="relation-period" id="relationPeriod"></p>
      </div>
      <a class="relation-back" href="index.html">← 返回日历</a>
    </header>
    <p class="relation-notice" id="relationNotice" role="status" aria-live="polite"></p>
    <div class="relation-scroll" id="relationScroll">
      <div class="relation-board" id="relationBoard">
        <svg id="relationSvg" aria-hidden="true">
          <g id="relationLines"></g>
          <path id="temporaryLine" d="" />
        </svg>
        <div class="relation-columns">
          <section class="relation-column" data-column="week"><h2>本周</h2><div class="relation-cards" id="weekCards"></div></section>
          <section class="relation-column" data-column="month"><h2>本月</h2><div class="relation-cards" id="monthCards"></div></section>
          <section class="relation-column" data-column="year"><h2>今年</h2><div class="relation-cards" id="yearCards"></div></section>
        </div>
      </div>
    </div>
  </main>
  <script src="assets/lifeos-shared.js"></script>
  <script src="assets/window-controls.js"></script>
  <script src="assets/app-background.js"></script>
  <script src="assets/目标关系.js"></script>
</body>
</html>
